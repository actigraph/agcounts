[project]
name = "agcounts"
version = "0.2.6"
description = "This project contains code to generate activity counts from accelerometer data."
authors = [{ name = "Actigraph LLC", email = "data.science@theactigraph.com" }]
requires-python = ">=3.8.1,<3.13"
readme = "README.md"
license = "GPL-3.0-or-later"
maintainers = [{ name = "Ali Neishabouri", email = "ali.neishabouri@theactigraph.com" }]
dependencies = [
    "numpy>=1.23.3",
    "pandas>=1.2.5",
    "scipy>=1.7.3",
    "mne>=1.4.0",
]

[project.urls]
Repository = "https://github.com/actigraph/agcounts"

[dependency-groups]
dev = [
    "black>=24.4.2,<25",
    "mypy>=1.11.1,<2",
    "flake8>=7.1.0,<8",
    "pydocstyle>=6.3.0,<7",
    "pytest>=8.3.2,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
mypy_path = "agcounts"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true
