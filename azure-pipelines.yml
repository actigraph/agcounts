trigger:
- main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Python39:
      python.version: '3.9'
    Python310:
      python.version: '3.10'
    Python311:
      python.version: '3.11'
    Python312:
      python.version: '3.12'

steps:
- checkout: self
  lfs: true

- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Use Python $(python.version)'

- script: |
    python -m pip install --upgrade pip uv
  displayName: 'Install package and tools'

- script: |
    uv sync
  condition: always()

- script: |
    uv run make lint
  displayName: 'Check for style'

- script: |
    uv run make test
  displayName: 'Run regression tests'
